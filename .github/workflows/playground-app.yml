# @vx/INFO: @vx/ci - trigger
name: playground-app | bnd

on:
  workflow_dispatch:
  push:
    branches: [timeline, next, feat/*]
    paths:
      - '.github/workflows/playground-app.yml'
      - 'vx/handbooks/ci.md'
      # - 'packages/**'
      - 'apps-internals/playground-app/**'

jobs:
  run_if:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.filter.outputs.all }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            all:
              - '.github/workflows/playground-app.yml'
              - 'vx/handbooks/ci.md'
            deploy:
              - 'apps-internals/playground-app/**'
              - 'packages/**'

  deploy:
    needs: run_if
    permissions:
      contents: write # Publish the deployment URLs as a commit comment.
    if: ${{ needs.run_if.outputs.all == 'true' || needs.run_if.outputs.deploy == 'true' }}
    name: playground-app | ${{ github.ref_name }}
    uses: vezham/vx-fe-deployer/.github/workflows/playground-app.yml@labs
    # secrets: inherit
    # Pass secrets explicitly to the reusable workflow in the vezham organization.
    secrets:
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
      PLAYGROUND_DOCS_TVA_GCP_SA_KEY: ${{ secrets.PLAYGROUND_TVA_GCP_SA_KEY }}
      PLAYGROUND_APP_DEV_GCP_SA_KEY: ${{ secrets.PLAYGROUND_TVA_GCP_SA_KEY }}
      PLAYGROUND_APP_QA_GCP_SA_KEY: ${{ secrets.PLAYGROUND_TVA_GCP_SA_KEY }}
      PLAYGROUND_APP_PREVIEW_GCP_SA_KEY: ${{ secrets.PLAYGROUND_TVA_GCP_SA_KEY }}
      PLAYGROUND_APP_LIVE_GCP_SA_KEY: ${{ secrets.PLAYGROUND_TVA_GCP_SA_KEY }}
    with:
      CALLER: ${{ github.ref_name }}
