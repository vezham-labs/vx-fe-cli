            pixelRatio: 2
          - device: ipad
            width: 834
            height: 1194
            pixelRatio: 2
          - device: ipad
            width: 1024
            height: 1366
            pixelRatio: 2
    microsoft:
      startUrl: /
  social:
    openGraph:
      type: website
      image: /og/image.png
    twitter:
      creator: '@vezham'
      site: '@vezham'
      card: summary_large_image
      image: /og/image.png
